<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>PatchFlux</title>
    <meta http-equiv="refresh" content="0; url=/de/" />
    <link rel="canonical" href="/de/" />
    <meta name="robots" content="noindex" />

    <p>Weiterleitung zu <a href="/de/">/de/</a> &middot; Redirecting to <a href="/en/">/en/</a>.</p>
  </body>
</html>
